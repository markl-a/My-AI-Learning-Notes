# ============================================================
# MkDocs Configuration - AI Learning Notes 文檔網站
# ============================================================
# [WIP] nav 路徑與實際目錄不符,2026-05 標記待重寫
# 目前許多 nav 條目指向不存在的子目錄(深度學習基礎、Transformer 架構、
# 預訓練模型、多模態 AI、AI-Agent、面試題庫 子節點),已先註解掉。
# 待完整重新規劃 site nav,對應現在 22 主題 + frontier 章節的實際結構。

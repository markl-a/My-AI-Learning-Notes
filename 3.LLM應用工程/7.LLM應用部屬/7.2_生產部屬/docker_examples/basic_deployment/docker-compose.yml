version: '3.8'

services:
  # LLM API 服務
  llm-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-api
    ports:
      - "8000:8000"
    environment:
      # API 金鑰（從環境變數或 .env 文件讀取）
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # 應用配置
      - APP_NAME=LLM API Service
      - LOG_LEVEL=INFO
      - MAX_WORKERS=4
    env_file:
      - .env  # 可選：從 .env 文件讀取環境變數
    volumes:
      # 掛載日誌目錄（持久化日誌）
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - llm-network

  # Nginx 反向代理（可選）
  nginx:
    image: nginx:alpine
    container_name: llm-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # SSL 證書
    depends_on:
      - llm-api
    restart: unless-stopped
    networks:
      - llm-network

networks:
  llm-network:
    driver: bridge


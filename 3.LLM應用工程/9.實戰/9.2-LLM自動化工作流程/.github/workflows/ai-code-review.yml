name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.py'
      - '**.js'
      - '**.ts'

jobs:
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # 獲取完整歷史以便比較

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v40
        with:
          files: |
            **.py
            **.js
            **.ts

      - name: Run AI Code Review
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Reviewing changed files:"
          echo "${{ steps.changed-files.outputs.all_changed_files }}"

          # 為每個更改的文件創建審查
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            echo "Reviewing: $file"
            python src/cli.py review "$file" --format json --output "review_${file//\//_}.json" || true
          done

      - name: Post review comments
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // 讀取所有審查報告
            const reviewFiles = fs.readdirSync('.')
              .filter(f => f.startsWith('review_') && f.endsWith('.json'));

            for (const reviewFile of reviewFiles) {
              try {
                const review = JSON.parse(fs.readFileSync(reviewFile, 'utf8'));

                // 創建 PR 評論
                const body = `## 🤖 AI 代碼審查報告

**文件**: \`${review.filename}\`
**質量分數**: ${review.score}/10

### 總結
${review.summary}

### 發現的問題 (${review.issues.length})
${review.issues.slice(0, 10).map(issue =>
  `- **[${issue.severity}]** ${issue.type}: ${issue.message}${issue.line_start ? ` (第${issue.line_start}行)` : ''}`
).join('\n')}

${review.issues.length > 10 ? `\n*...還有 ${review.issues.length - 10} 個問題*` : ''}

### 建議
${review.suggestions.slice(0, 5).map((s, i) => `${i+1}. ${s}`).join('\n')}
`;

                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: body
                });

              } catch (error) {
                console.error(`Error processing ${reviewFile}:`, error);
              }
            }

      - name: Add labels based on review
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // 檢查是否有嚴重問題
            const reviewFiles = fs.readdirSync('.')
              .filter(f => f.startsWith('review_') && f.endsWith('.json'));

            let hasCritical = false;
            let needsImprovement = false;

            for (const reviewFile of reviewFiles) {
              const review = JSON.parse(fs.readFileSync(reviewFile, 'utf8'));
              if (review.issues.some(i => i.severity === 'critical')) {
                hasCritical = true;
              }
              if (review.score < 7) {
                needsImprovement = true;
              }
            }

            const labels = ['ai-reviewed'];
            if (hasCritical) labels.push('critical-issues');
            if (needsImprovement) labels.push('needs-improvement');

            await github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: labels
            });

      - name: Upload review reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: ai-review-reports
          path: review_*.json
          retention-days: 30

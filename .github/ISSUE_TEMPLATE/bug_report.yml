name: 🐛 Bug 報告
description: 報告一個問題或錯誤
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感謝您花時間填寫此錯誤報告！

  - type: textarea
    id: what-happened
    attributes:
      label: 發生了什麼？
      description: 請詳細描述這個 bug
      placeholder: 告訴我們您看到了什麼！
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 預期行為
      description: 您期望發生什麼？
      placeholder: 描述預期的正確行為
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 重現步驟
      description: 如何重現這個問題？
      placeholder: |
        1. 進入 '...'
        2. 點擊 '....'
        3. 滾動到 '....'
        4. 看到錯誤
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 問題領域
      description: 這個 bug 屬於哪個領域？
      options:
        - 數學基礎
        - 機器學習
        - 深度學習
        - LLM 基礎
        - RAG 系統
        - Agent 系統
        - 代碼示例
        - 文檔
        - 其他
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 環境信息
      description: 請提供您的環境信息
      value: |
        - OS: [如 Ubuntu 22.04]
        - Python 版本: [如 3.11.5]
        - 相關庫版本: [如 PyTorch 2.5.0]
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 錯誤日誌
      description: 請粘貼相關的錯誤日誌或截圖
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: 檢查清單
      description: 提交前請確認
      options:
        - label: 我已搜索過現有的 issues
          required: true
        - label: 我已閱讀過相關文檔
          required: true
        - label: 我提供了足夠的信息來重現此問題
          required: true

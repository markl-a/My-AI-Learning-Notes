# ============================================================
# CI Workflow - 持續集成
# ============================================================
#
# 觸發條件：
# - Push 到 main 分支
# - Pull Request 到 main 分支
# - 手動觸發
#
# ============================================================

name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '1.從AI到LLM基礎/4.DL/00.DL_Path/4_多層感知機/D2L_Jupyter_Notebooks/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '1.從AI到LLM基礎/4.DL/00.DL_Path/4_多層感知機/D2L_Jupyter_Notebooks/**'
  workflow_dispatch:

jobs:
  # ==================== 代碼質量檢查 ====================
  lint:
    name: 代碼質量檢查
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - name: 📥 Checkout 代碼
        uses: actions/checkout@v4

      - name: 🐍 設置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: 📦 安裝依賴
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 🔍 Ruff - 代碼檢查
        run: |
          ruff check . --output-format=github
        continue-on-error: true  # 教學 repo 大量 notebook 風格碼，Ruff 僅供參考

      - name: 🎨 Black - 代碼格式檢查
        run: |
          black --check --diff .
        continue-on-error: true  # 同上，僅供參考

      - name: 📝 MyPy - 類型檢查
        run: |
          mypy . --ignore-missing-imports --no-strict-optional
        continue-on-error: true  # 類型檢查可以較寬鬆

  # ==================== 單元測試 ====================
  test:
    name: 單元測試
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.11', '3.12']
        exclude:
          # 減少測試矩陣，加快速度
          - os: windows-latest
            python-version: '3.9'
          - os: macos-latest
            python-version: '3.9'

    steps:
      - name: 📥 Checkout 代碼
        uses: actions/checkout@v4

      - name: 🐍 設置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: 📦 安裝依賴
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 🧪 運行測試
        run: |
          pytest -v --cov=. --cov-report=xml --cov-report=term-missing
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: 📊 上傳覆蓋率報告
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # ==================== Notebook 格式驗證 ====================
  # 註:原本是 execute 全 repo 所有 .ipynb,但 repo 內有 700+ d2l notebook +
  # Colab notebook 需要 GPU/API key,在 free CI runner 上跑會 hang ~50 分鐘
  # 才被 timeout。改為只驗證 nbformat 結構合法(秒級完成,壞 notebook 就擋)
  notebook-validate:
    name: Notebook 格式驗證
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout 代碼
        uses: actions/checkout@v4

      - name: 🐍 設置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 安裝 nbformat
        run: |
          python -m pip install --upgrade pip
          pip install nbformat

      - name: 📓 驗證所有 .ipynb 結構合法
        run: |
          python <<'PY'
          import nbformat
          import pathlib
          import sys

          errors = []
          checked = 0
          for nb_path in pathlib.Path('.').rglob('*.ipynb'):
              if '.ipynb_checkpoints' in nb_path.parts:
                  continue
              checked += 1
              try:
                  nb = nbformat.read(nb_path, as_version=4)
                  nbformat.validate(nb)
              except Exception as e:
                  errors.append((str(nb_path), type(e).__name__, str(e)[:200]))

          print(f"檢查了 {checked} 個 .ipynb")
          if errors:
              print(f"\n❌ {len(errors)} 個 notebook 格式異常:")
              for path, err_type, msg in errors:
                  print(f"  - {path}: {err_type}: {msg}")
              sys.exit(1)
          print("✅ 所有 notebook 格式合法")
          PY

  # ==================== 安全掃描 ====================
  security:
    name: 安全掃描
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout 代碼
        uses: actions/checkout@v4

      - name: 🐍 設置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 安裝依賴
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: 🔐 Bandit - 安全漏洞掃描
        run: |
          # 掃描高危漏洞(僅供參考,教學 repo 含示範密鑰/不安全範例會被誤報)
          bandit -r . -f json -o bandit-report.json -ll
          # -ll 只報告中等及以上嚴重性的問題
        continue-on-error: true  # 教學 repo 含示範密鑰/不安全範例，僅作參考

      - name: 🔍 Pip Audit - 依賴審計(擋真實 CVE)
        run: |
          # 審計根 requirements,發現已知漏洞即擋
          # 註:safety 在新版本 API 改動,改用 pip-audit 一支即可
          pip-audit --desc --strict

      - name: 📤 上傳安全報告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: bandit-report.json

  # ==================== 狀態報告 ====================
  # 註:原本還有 build job 跑 python -m build,但此 repo 是個人學習筆記,
  # 並非要發布到 PyPI 的 Python package,根目錄含多個 top-level 資料夾
  # (img/i18n/demos/...),setuptools 無法自動偵測 package,因此 build 永遠失敗
  # 已移除 build job 以對齊 repo 實際性質
  status:
    name: CI 狀態報告
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    if: always()
    steps:
      - name: 📊 檢查所有作業狀態
        run: |
          echo "Lint: ${{ needs.lint.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Security: ${{ needs.security.result }}"

      - name: ✅ 所有檢查通過
        if: |
          needs.lint.result == 'success' &&
          needs.test.result == 'success' &&
          needs.security.result == 'success'
        run: echo "✅ 所有 CI 檢查通過！"

      - name: ❌ 部分檢查失敗
        if: |
          needs.lint.result != 'success' ||
          needs.test.result != 'success' ||
          needs.security.result != 'success'
        run: |
          echo "❌ 部分 CI 檢查失敗，請查看詳細日誌"
          exit 1
